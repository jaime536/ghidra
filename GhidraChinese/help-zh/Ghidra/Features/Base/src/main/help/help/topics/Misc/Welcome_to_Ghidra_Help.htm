<h1 align="center"><a name="Ghidra_Help_Contents"></a>欢迎使用 Ghidra 帮助...</h1>

<p align="center"><img border="0" src="images/GHIDRA_1.png" height="339" width="500" alt="">
</p>
<div align="left">
<p>Ghidra 为菜单项、对话框、按钮和工具窗口提供上下文相关的帮助。在任意菜单项或对话框上
按 &lt;F1&gt; 或 &lt;Help&gt; 即可打开帮助。如果某一项没有专门的帮助内容，就会显示本页面。</p>
