# Ghidra 简体中文界面词典 (UTF-8)
#
# 键 = 源码中的英文原文(已去除助记符 &)，值 = 中文译文。
# 查不到的条目会原样显示英文，因此可以渐进补充。
# 注意: .properties 的键中空格必须转义为 '\ '。
#
# 启用: ghidraRun -Dghidra.i18n=zh_CN
# 收集未翻译字符串: -Dghidra.i18n.dump=/tmp/missing.properties


