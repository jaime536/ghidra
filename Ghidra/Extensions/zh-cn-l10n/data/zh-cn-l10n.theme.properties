[Defaults]

// CJK font overrides.
//
// This module exists to win the theme merge without patching any upstream file:
// PropertyFileThemeDefaults loads every *.theme.properties in module-directory order and lets
// the last one win, and module directories are iterated as a sorted map.  A lowercase name sorts
// after Base/Docking/Gui/Decompiler, so the values below override the stock ones.
//
// Only the root ids are redefined - the ~60 other font ids in the product reference these.
// "Noto Sans CJK SC" is the common Linux packaging; the fallbacks cover macOS and Windows.

font.standard = Noto Sans CJK SC-PLAIN-12
font.monospaced = Noto Sans Mono CJK SC-PLAIN-12

[laf.font]Menu.font = font.standard
[laf.font]MenuItem.font = font.standard
[laf.font]MenuBar.font = font.standard
[laf.font]PopupMenu.font = font.standard
[laf.font]Label.font = font.standard
[laf.font]Button.font = font.standard
[laf.font]CheckBox.font = font.standard
[laf.font]RadioButton.font = font.standard
[laf.font]ComboBox.font = font.standard
[laf.font]TabbedPane.font = font.standard
[laf.font]Table.font = font.standard
[laf.font]TableHeader.font = font.standard
[laf.font]Tree.font = font.standard
[laf.font]ToolTip.font = font.standard
[laf.font]TitledBorder.font = font.standard

// The only stock font id naming a Latin-only family outright; the rest resolve through the
// two roots above.
font.table.header.number = Noto Sans CJK SC-BOLD-12
