// A data-only module: it ships the Simplified Chinese catalog read by generic.i18n.L10N and a
// theme file supplying CJK-capable fonts.  There is no Java here, so only Module.manifest and
// data/ need to reach the distribution.
//
// The directory name is deliberately lowercase.  Theme defaults are merged in module-name order
// with the last writer winning, so sorting after Base/Docking/Gui/Decompiler is what lets this
// module override their font ids without patching them.

apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
