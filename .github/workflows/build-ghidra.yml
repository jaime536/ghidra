name: Build Ghidra

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发版 tag（留空＝只构建不发版），例如 ghidra-zh-12.1.2-r1'
        required: false
        default: ''

defaults:
  run:
    # Windows runners default to PowerShell, which cannot run the awk/$GITHUB_ENV steps below
    # or the gradlew shell script.  Git Bash is present on every runner and the Gradle wrapper
    # detects MSYS, so one bash shell serves both platforms.
    shell: bash

jobs:
  # Fast feedback on the localization assets; these are hand-edited files where a mistake is
  # invisible at runtime (the string simply stays English), so they are checked explicitly.
  localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --source-strings cross-checks every key against the strings L10N can actually see. A
      # mistyped key, or one upstream has since reworded, produces no error at runtime - the line
      # just stays English - so it has to be caught here.
      - name: Check translation catalogs
        run: |
          python tools/extract_strings.py > /tmp/source-strings.txt
          python tools/check_catalog.py Ghidra/Extensions/zh-cn-l10n/data/i18n/*.properties \
            --source-strings /tmp/source-strings.txt

      - name: Report stale help translations
        run: python tools/help_zh.py check

  build:
    strategy:
      # A failure on one platform should not cancel the others; the Linux package is the one
      # most people need.
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (mac_arm_64).  Native code is packaged per-platform and
        # Application.getOSFile has no linux->mac fallback, so a Mac package must be built on a
        # Mac.  Note this package targets Apple Silicon only: the one fallback that exists runs
        # the other way (MAC_ARM_64 -> MAC_X86_64, i.e. Apple Silicon can use Intel binaries via
        # Rosetta), so serving Intel Macs would mean adding a macos-13 leg.
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      # Both settings have to precede checkout.
      #
      # Line endings: Ghidra's gradlew reads application.properties with a POSIX `read` loop and
      # then checks application.release.name against PUBLIC/DEV.  A CRLF checkout leaves a
      # trailing \r on every value, that check fails, and the script exits with a misleading
      # "Please install Gradle ... and put it on your PATH".  autocrlf has to be turned off *and*
      # eol forced, since autocrlf overrides core.eol and .gitattributes marks *.properties as
      # `text` (whose checkout encoding follows core.eol, defaulting to native).  Files that
      # genuinely need CRLF - .bat, .sln, .vcxproj - carry an explicit eol=crlf attribute, which
      # outranks core.eol, so MSVC tooling is unaffected.
      #
      # Long paths: the source tree is deeply nested and the build writes deeper still, which
      # trips the legacy 260-character limit.
      - name: Configure git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
          git config --system core.eol lf

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      # Required by the build itself (PyGhidra); Gradle probes for python3/python/py, and
      # setup-python guarantees a version inside application.python.supported.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No MSVC setup step: GPL/vsconfig.gradle locates Visual Studio itself through vswhere.exe
      # and reads the SDK version out of vcvarsall.bat, so the toolchain does not need to be
      # pre-activated in the shell.  windows-latest ships VS with the C++ workload (MSVC,
      # Windows SDK, ATL), which is what CheckToolChain requires.
      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      # The Chinese help pages live in a parallel tree so that upstream's own help files stay
      # untouched in git; they have to be laid over the source tree before the help tasks run.
      - name: Overlay Chinese help pages
        run: python tools/help_zh.py apply

      - name: Build Ghidra
        run: ./gradlew buildGhidra --parallel

      # buildGhidra only produces a package for the platform it runs on, so each matrix leg
      # contributes its own zip.
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-zh-${{ matrix.platform }}
          path: build/dist/*.zip
          if-no-files-found: error

  release:
    # Releases come from a tag, either pushed directly or named in the release_tag input on a
    # manual run. The input exists because publishing otherwise requires a local clone and a
    # command line; with it, a release is a form on the Actions tab.
    #
    # always() is what keeps one broken platform from blocking the whole release: `needs`
    # normally requires every matrix leg to have succeeded, which would contradict
    # fail-fast: false and throw away good packages because a different platform failed. The
    # coverage step still refuses to publish when nothing at all was built.
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # action-gh-release does not document creating a missing tag, so create it here rather
      # than rely on unspecified behaviour. GITHUB_TOKEN can write refs; note that a push made
      # with it deliberately does not start another workflow run, so this cannot loop.
      - name: Create tag
        if: ${{ inputs.release_tag != '' }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::标签 $RELEASE_TAG 已存在，沿用它。"
            exit 0
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Download distributions
        uses: actions/download-artifact@v4
        # v4 fails outright when the pattern matches nothing, which would pre-empt the clearer
        # diagnosis from the next step
        continue-on-error: true
        with:
          pattern: ghidra-zh-*
          merge-multiple: true
          path: dist

      # Names the platforms this release actually ships, and flags any that are missing, so a
      # partial release is labelled rather than silently short.
      - name: Record platform coverage
        run: python3 tools/release_notes.py dist notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly: on a manual run github.ref_name is the branch, not the tag.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
